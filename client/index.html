<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Mobile-first viewport: no zoom, no scaling -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- PWA / home-screen color -->
  <meta name="theme-color" content="#1a1a2e">

  <title>Heroes Mini — Telegram Strategy</title>

  <!-- Telegram Mini App SDK (gracefully ignored outside Telegram) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!--
    Single canvas element for the entire game.
    Resolution is set dynamically in JS to match devicePixelRatio.
  -->
  <canvas id="gameCanvas"></canvas>

  <!-- ES Module entry point -->
  <script type="module" src="js/main.js"></script>

</body>
</html>
