<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Heroes Mini</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <!-- Top Bar -->
        <div id="top-bar">
            <div class="resource" id="gold-display">💰 0</div>
            <div class="resource" id="day-display">📅 Day 1</div>
        </div>

        <!-- Game Map -->
        <div id="map-container">
            <canvas id="game-canvas"></canvas>
        </div>

        <!-- Bottom Panel -->
        <div id="bottom-panel">
            <div id="hero-info">
                <div class="hero-portrait" id="active-hero-portrait"></div>
                <div class="hero-stats">
                    <div id="hero-name">Hero</div>
                    <div id="hero-army">Army: 0</div>
                    <div id="hero-movement">Movement: 0/0</div>
                </div>
            </div>
            <div id="action-buttons">
                <button id="btn-end-turn" class="action-btn">End Turn</button>
                <button id="btn-swap-hero" class="action-btn">Swap Hero</button>
            </div>
        </div>

        <!-- Unit Panel (when selected) -->
        <div id="unit-panel" class="hidden">
            <div id="unit-details"></div>
            <button id="btn-recruit" class="action-btn">Recruit</button>
            <button id="btn-close-unit" class="action-btn">Close</button>
        </div>
    </div>

    <script src="js/core.js"></script>
    <script src="js/map.js"></script>
    <script src="js/entities.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
